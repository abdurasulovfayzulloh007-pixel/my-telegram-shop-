<!DOCTYPE html>
<html lang="uz">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Vodiy Savdo</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <style>
        :root {
            --main-color: #007aff; 
            --bg-color: var(--tg-theme-bg-color, #ffffff);
            --text-color: var(--tg-theme-text-color, #222222);
            --card-bg: var(--tg-theme-secondary-bg-color, #f2f2f7);
            --accent-color: #34c759; 
        }
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background-color: var(--bg-color); color: var(--text-color);
            margin: 0; padding: 16px; padding-bottom: 100px;
        }
        .brand-header { text-align: center; margin-bottom: 20px; }
        .brand-header h2 { font-size: 24px; font-weight: 800; color: var(--main-color); margin: 0; }
        .brand-header p { margin: 5px 0 0 0; font-size: 13px; opacity: 0.6; }
        .search-container { margin-bottom: 20px; }
        .search-input {
            width: 100%; padding: 12px 16px; border-radius: 12px; border: none; 
            background: var(--card-bg); color: var(--text-color); font-size: 15px; box-sizing: border-box;
        }
        .category-section { margin-bottom: 25px; }
        .category-title { font-size: 18px; font-weight: 700; margin-bottom: 12px; display: flex; align-items: center; gap: 8px; }
        .category-title::before { content: ''; display: inline-block; width: 4px; height: 18px; background: var(--main-color); border-radius: 4px; }
        .products-grid { display: grid; grid-template-columns: repeat(2, 1fr); gap: 12px; }
        .product-card { background: var(--card-bg); border-radius: 16px; padding: 12px; display: flex; flex-direction: column; justify-content: space-between; }
        .product-img { width: 100%; height: 110px; object-fit: cover; border-radius: 12px; margin-bottom: 10px; }
        .product-title { font-size: 14px; font-weight: 600; line-height: 1.3; margin-bottom: 6px; height: 36px; overflow: hidden; }
        .product-price { color: var(--accent-color); font-weight: 700; font-size: 15px; margin-bottom: 12px; }
        .btn-add { background-color: var(--main-color); color: #fff; border: none; width: 100%; padding: 10px 0; border-radius: 10px; font-weight: 600; }
        .counter-box { display: flex; justify-content: space-between; align-items: center; display: none; }
        .btn-count { background: #ffffff; color: var(--main-color); border: 1px solid #e5e5ea; width: 34px; height: 34px; font-size: 20px; font-weight: 600; border-radius: 10px; }
        .cart-status { position: fixed; bottom: 20px; left: 16px; right: 16px; background: var(--main-color); border-radius: 16px; display: none; }
        .main-btn { width: 100%; background: none; border: none; color: #fff; padding: 16px; font-size: 16px; font-weight: 700; display: flex; justify-content: space-between; align-items: center; box-sizing: border-box; }
    </style>
</head>
<body>

    <div class="brand-header">
        <h2>VODIY SAVDO</h2>
        <p>Sifatli uy ro'zg'or buyumlari va ulgurji narxlar</p>
    </div>

    <div class="search-container">
        <input type="text" id="search-bar" class="search-input" placeholder="Mahsulot qidirish..." oninput="filterProducts()">
    </div>

    <div id="shop-container"></div>

    <div class="cart-status" id="cart-box">
        <button class="main-btn" onclick="getGeoAndSend()">
            <span>🛒 Buyurtmani tasdiqlash</span>
            <span id="total-price-btn">0 so'm</span>
        </button>
    </div>

    <script>
        const tg = window.Telegram.WebApp;
        tg.expand();

        // Botdan keladigan dinamik mahsulotlar ro'yxati
        let products = [];
        let cart = {};

        // Bot `main.py` orqali bazadagi mahsulotlarni HTML ga uzatadi
        const urlParams = new URLSearchParams(window.location.search);
        const encodedData = urlParams.get('data');
        if (encodedData) {
            try { products = JSON.parse(decodeURIComponent(encodedData)); } catch(e) { console.log(e); }
        }

        function displayShop(productsToRender = products) {
            const container = document.getElementById('shop-container');
            container.innerHTML = ""; 
            const categories = [...new Set(productsToRender.map(p => p.category))];
            
            if(categories.length === 0) {
                container.innerHTML = "<p style='text-align:center; opacity:0.5;'>Hozircha mahsulot yo'q yoki topilmadi 😔</p>";
                return;
            }

            categories.forEach(cat => {
                const sec = document.createElement('div');
                sec.className = 'category-section';
                sec.innerHTML = `<div class="category-title">${cat}</div>`;
                const grid = document.createElement('div');
                grid.className = 'products-grid';
                
                productsToRender.filter(p => p.category === cat).forEach(p => {
                    const isInCart = cart[p.id] && cart[p.id].count > 0;
                    const card = document.createElement('div');
                    card.className = 'product-card';
                    card.innerHTML = `
                        <img src="${p.image}" class="product-img" alt="${p.title}" onerror="this.src='https://dummyimage.com/400x300/ccc/000&text=Rasm'">
                        <div class="product-title">${p.title}</div>
                        <div class="product-price">${p.price.toLocaleString()} so'm</div>
                        <button id="add-btn-${p.id}" class="btn-add" style="display: ${isInCart ? 'none' : 'block'}" onclick="changeCount(${p.id}, 1)">Qo'shish</button>
                        <div id="counter-${p.id}" class="counter-box" style="display: ${isInCart ? 'flex' : 'none'}">
                            <button class="btn-count" onclick="changeCount(${p.id}, -1)">-</button>
                            <span id="num-${p.id}" style="font-weight:700;">${isInCart ? cart[p.id].count : 0}</span>
                            <button class="btn-count" onclick="changeCount(${p.id}, 1)">+</button>
                        </div>
                    `;
                    grid.appendChild(card);
                });
                sec.appendChild(grid); container.appendChild(sec);
            });
        }

        function filterProducts() {
            const query = document.getElementById('search-bar').value.toLowerCase();
            displayShop(products.filter(p => p.title.toLowerCase().includes(query) || p.category.toLowerCase().includes(query)));
        }

        function changeCount(id, change) {
            if (!cart[id]) {
                const prod = products.find(p => p.id === id);
                cart[id] = { title: prod.title, price: prod.price, count: 0 };
            }
            cart[id].count += change;
            if (cart[id].count <= 0) delete cart[id];
            
            displayShop();
            updateCartButton();
        }

        function updateCartButton() {
            let total = 0, itemsCount = 0;
            for (let id in cart) { total += cart[id].price * cart[id].count; itemsCount += cart[id].count; }
            document.getElementById('cart-box').style.display = itemsCount > 0 ? 'block' : 'none';
            document.getElementById('total-price-btn').innerText = total.toLocaleString() + " so'm";
        }

        // GPS Lokatsiyani olish va Botga yuborish
        function getGeoAndSend() {
            if (navigator.geolocation) {
                navigator.geolocation.getCurrentPosition(
                    (position) => { sendAllData(position.coords.latitude, position.coords.longitude); },
                    (error) => { alert("Iltimos, buyurtma berish uchun GPS (lokatsiya) ruxsatini bering!"); }
                );
            } else {
                sendAllData(null, null);
            }
        }

        function sendAllData(lat, lon) {
            let items = Object.values(cart);
            let total = items.reduce((sum, item) => sum + (item.price * item.count), 0);
            const orderData = { items: items, total: total, lat: lat, lon: lon };
            tg.sendData(JSON.stringify(orderData));
            tg.close();
        }

        displayShop();
    </script>
</body>
</html>
